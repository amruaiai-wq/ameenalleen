<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>อามีน กับ อัลลีน — เรียนรู้และเล่นแบบอิสลามิค</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FBF5EA;
    --cream-2:#FFFDF8;
    --green:#7FC9B3;
    --green-light:#B7E4D6;
    --green-dark:#3F8C77;
    --green-deep:#2E6B58;
    --gold:#EFCE86;
    --gold-deep:#D9A93E;
    --coral:#E9A98A;
    --coral-deep:#D9825C;
    --blue:#A9DDF0;
    --blue-deep:#6FB8D6;
    --purple:#D2BFA4;
    --purple-deep:#B69A76;
    --ink:#43554C;
    --ink-soft:#7E8F86;
    --ink-faint:#A9B6AE;
    --white:#FFFFFF;
    --line:rgba(63,140,119,.14);
    --line-strong:rgba(63,140,119,.24);
    --shadow-xs:0 2px 8px rgba(58,96,82,.08);
    --shadow-sm:0 6px 16px rgba(58,96,82,.12);
    --shadow-md:0 12px 28px rgba(58,96,82,.16);
    --shadow-lg:0 20px 44px rgba(58,96,82,.20);
    --shadow-press:0 3px 10px rgba(58,96,82,.14);
    --shadow-gold:0 10px 24px rgba(217,169,62,.30);
    --shadow-green:0 10px 24px rgba(63,140,119,.30);
    --radius-sm:16px;
    --radius-md:22px;
    --radius-lg:28px;
    --radius-xl:34px;
    --radius-pill:999px;
    --radius:28px;
    --ease:cubic-bezier(.34,1.56,.64,1);
    --ease-out:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Mali',sans-serif;
    color:var(--ink);
    background:var(--cream);
    background-image:
      radial-gradient(ellipse 900px 520px at 18% -12%, rgba(127,201,179,.16), transparent 60%),
      radial-gradient(ellipse 700px 500px at 105% 0%, rgba(239,206,134,.18), transparent 55%),
      radial-gradient(ellipse 600px 460px at -5% 90%, rgba(169,221,240,.14), transparent 55%),
      repeating-linear-gradient(45deg, rgba(63,140,119,.035) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(-45deg, rgba(63,140,119,.035) 0 1px, transparent 1px 34px);
    background-attachment:fixed;
    min-height:100vh;
    -webkit-user-select:none;user-select:none;
    overflow-x:hidden;
  }
  #app{max-width:520px;margin:0 auto;padding:0 16px 48px;position:relative;}
  :focus-visible{outline:3px solid var(--gold-deep);outline-offset:3px;border-radius:8px;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    display:flex;align-items:center;gap:10px;
    padding:14px 2px 14px;
    background:linear-gradient(var(--cream) 65%, rgba(251,245,234,0));
    backdrop-filter:blur(6px);
  }
  .back-btn{
    border:none;background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;
    height:42px;padding:0 16px 0 12px;border-radius:var(--radius-pill);font-size:15px;
    box-shadow:var(--shadow-green);cursor:pointer;flex:0 0 auto;
    display:flex;align-items:center;gap:3px;font-weight:700;font-family:inherit;
    transition:transform .15s var(--ease-out), box-shadow .15s;
  }
  .back-btn svg.lucide{stroke-width:2.6;width:20px;height:20px;}
  .back-btn:hover{transform:translateY(-1px) scale(1.03);box-shadow:var(--shadow-lg);}
  .back-btn:active{transform:scale(.9);box-shadow:var(--shadow-press);}
  .topbar h2{font-size:20px;margin:0;font-weight:700;color:var(--green-dark);letter-spacing:.2px;}
  .topbar .spacer{flex:1;}
  .score-pill{
    background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#5b4200;font-weight:700;
    padding:9px 16px;border-radius:var(--radius-pill);font-size:15px;box-shadow:var(--shadow-gold);
    display:inline-flex;align-items:center;gap:4px;
  }

  /* ---------- Home ---------- */
  .home-head{position:relative;z-index:0;text-align:center;padding:18px 0 6px;}
  .sparkle-field{position:absolute;inset:0;z-index:-1;pointer-events:none;}
  .sparkle-field span{position:absolute;font-size:16px;opacity:.5;animation:twinkle 3.2s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.15;transform:scale(.7) rotate(0deg);}50%{opacity:.7;transform:scale(1.15) rotate(14deg);}}
  .bismillah{font-size:27px;color:var(--green-dark);font-weight:600;margin:0;direction:rtl;text-shadow:0 2px 10px rgba(63,140,119,.15);}
  .bismillah-th{font-size:13px;color:var(--ink-soft);margin:3px 0 0;letter-spacing:.3px;}
  .mascot{
    width:120px;height:120px;margin:6px auto 2px;display:block;
    animation:float 3.2s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  .brand{
    font-size:28px;font-weight:700;margin:6px 0 0;white-space:nowrap;
    background:linear-gradient(135deg,var(--green-dark),var(--green-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .tagline{color:var(--ink-soft);margin:4px 0 22px;font-size:15px;}

  /* ---------- Home rails (คอราเซล) ---------- */
  .rail{margin-top:18px;}
  .rail-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 2px;}
  .rail-title{font-weight:700;font-size:16px;color:var(--green-dark);}
  .rail-all{border:none;background:rgba(63,140,119,.10);color:var(--green-dark);font-family:inherit;
    font-weight:700;font-size:12px;padding:5px 11px;border-radius:var(--radius-pill);cursor:pointer;}
  .rail-all:active{transform:scale(.94);}
  .rail-track{display:flex;gap:11px;overflow-x:auto;padding:11px 2px 6px;margin:0 -2px;
    scrollbar-width:none;-ms-overflow-style:none;overscroll-behavior-x:contain;
    scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;}
  .rail-track::-webkit-scrollbar{display:none;height:0;}
  .rail-chip{flex:0 0 auto;width:92px;border:none;background:none;padding:0;cursor:pointer;
    font-family:inherit;text-align:center;scroll-snap-align:center;}
  .rc-art{position:relative;display:flex;align-items:center;justify-content:center;gap:2px;width:92px;height:80px;
    border-radius:var(--radius-md);background:linear-gradient(160deg,var(--cream-2),var(--white));
    border:1px solid var(--line);box-shadow:var(--shadow-sm);overflow:hidden;
    transition:transform .15s var(--ease-out);}
  .rc-art>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .rail-chip.rc-photo .rc-art{background:linear-gradient(135deg,rgba(239,206,134,.35),rgba(127,201,179,.25));}
  .rail-chip.rc-white .rc-art{background:var(--white);}
  .rail-chip.rc-white .rc-art>img{object-fit:contain;padding:5px;}
  .rail-chip:active .rc-art{transform:scale(.92);}
  .rc-emoji{font-size:38px;}
  .rc-game{display:flex;align-items:center;justify-content:center;gap:2px;transform:scale(.62);}
  .rc-label{display:block;font-size:11.5px;font-weight:700;margin-top:6px;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- Game art (ไอคอนเกมแบบรูปภาพ) ---------- */
  .game-art{display:flex;align-items:center;justify-content:center;gap:3px;height:52px;}
  .ga-i{width:30px;height:30px;object-fit:contain;filter:drop-shadow(0 2px 3px rgba(0,0,0,.12));}
  .ga-card{width:25px;height:33px;border-radius:5px;object-fit:cover;box-shadow:var(--shadow-xs);}
  .ga-shadow{filter:brightness(0) opacity(.72);}
  .ga-pop{transform:scale(1.18) rotate(7deg);}
  .ga-num{width:26px;height:26px;}
  .ga-q{font-size:21px;font-weight:700;color:var(--gold-deep);}
  .ga-op{font-size:16px;font-weight:700;color:var(--ink-soft);}
  .ga-arrow{font-size:16px;color:var(--green-dark);}
  .ga-pads{display:grid;grid-template-columns:1fr 1fr;gap:3px;}
  .ga-pad{display:block;width:16px;height:16px;border-radius:5px;}
  .ga-pad.p1{background:#7FC9B3;}
  .ga-pad.p2{background:#EFCE86;}
  .ga-pad.p3{background:#9BD1E8;}
  .ga-pad.p4{background:#E0B48C;}

  /* ---------- Generic screens ---------- */
  .screen{display:none;animation:fadein .3s var(--ease-out);}
  .screen.active{display:block;}
  @keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .hub-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;}
  .hub-item{
    border:1px solid var(--line);cursor:pointer;font-family:inherit;color:var(--ink);
    background:linear-gradient(180deg,var(--cream-2),var(--white));border-radius:var(--radius-md);padding:20px 12px;
    box-shadow:var(--shadow-sm);text-align:center;transition:transform .16s var(--ease-out), box-shadow .16s;
  }
  .hub-item:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);}
  .hub-item:active{transform:scale(.95);box-shadow:var(--shadow-press);}
  .hub-item .t{font-weight:700;margin-top:9px;font-size:16px;}
  .hub-item .d{font-size:12px;color:var(--ink-soft);margin-top:3px;}

  /* ---------- Game shared ---------- */
  .game-wrap{background:linear-gradient(180deg,var(--cream-2),var(--white));border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow-md);margin-top:10px;border:1px solid var(--line);}
  .prompt{text-align:center;font-size:19px;font-weight:600;margin:4px 0 18px;color:var(--green-dark);}
  .noor-say{
    display:flex;align-items:center;gap:10px;justify-content:center;
    background:linear-gradient(135deg,rgba(127,201,179,.16),rgba(169,221,240,.14));
    border-radius:var(--radius-md);padding:11px 16px;margin:16px 0 4px;
    font-weight:600;color:var(--green-dark);font-size:16px;min-height:30px;
    border:1px solid rgba(63,140,119,.14);
  }
  .noor-say img{flex:0 0 auto;}
  .choices{display:grid;gap:12px;margin-top:8px;}
  .choices.g2{grid-template-columns:1fr 1fr;}
  .choices.g3{grid-template-columns:1fr 1fr 1fr;}
  .opt{
    border:2px solid var(--line-strong);background:var(--white);border-radius:var(--radius-md);
    font-size:44px;padding:16px 8px;cursor:pointer;font-family:inherit;
    transition:transform .12s var(--ease-out), border-color .15s, box-shadow .15s;
    display:flex;align-items:center;justify-content:center;
    min-height:80px;box-shadow:var(--shadow-xs);
  }
  .opt:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);}
  .opt:active{transform:scale(.92);}
  .opt.correct{border-color:var(--green);background:rgba(63,140,119,.12);box-shadow:var(--shadow-green);}
  .opt.wrong{border-color:var(--coral-deep);background:rgba(233,169,138,.16);}
  .opt.num{font-size:34px;font-weight:700;color:var(--green-dark);}
  .seq{display:flex;gap:9px;justify-content:center;align-items:center;flex-wrap:wrap;font-size:40px;margin:10px 0 4px;}
  .seq .q{background:linear-gradient(135deg,var(--gold),var(--gold-deep));border-radius:16px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#6b4f13;box-shadow:var(--shadow-gold);}
  .count-box{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;background:var(--white);border-radius:var(--radius-md);padding:20px;margin-bottom:8px;font-size:40px;border:2px solid var(--line-strong);box-shadow:var(--shadow-xs);}
  .shadow-target{font-size:70px;text-align:center;margin:4px 0 2px;}
  .shadow-opt{filter:brightness(0) opacity(.82);}
  .ico-img{width:1em;height:1em;object-fit:contain;display:inline-block;vertical-align:middle;}
  .cardback-img{width:56%;height:56%;object-fit:contain;}
  .opt{position:relative;}
  .opt.correct::after,.opt.wrong::after{
    content:"";position:absolute;top:-9px;right:-9px;width:28px;height:28px;
    background-size:contain;background-repeat:no-repeat;background-position:center;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,.25));
  }
  .opt.correct::after{background-image:url('/icon-web/ui/03_correct_sticker.png');}
  .opt.wrong::after{background-image:url('/icon-web/ui/04_wrong_sticker.png');}

  .primary-btn{
    display:block;width:100%;border:none;cursor:pointer;font-family:inherit;
    background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;font-weight:700;font-size:18px;
    padding:16px;border-radius:var(--radius-md);box-shadow:var(--shadow-green);margin-top:18px;
    transition:transform .15s var(--ease-out), box-shadow .15s;
  }
  .primary-btn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  .primary-btn:active{transform:scale(.97);box-shadow:var(--shadow-press);}
  .ghost-btn{
    display:block;width:100%;border:2px solid var(--green-dark);cursor:pointer;font-family:inherit;
    background:transparent;color:var(--green-dark);font-weight:700;font-size:16px;
    padding:13px;border-radius:var(--radius-md);margin-top:11px;
    transition:background .15s, transform .12s var(--ease-out);
  }
  .ghost-btn:hover{background:rgba(63,140,119,.08);}
  .ghost-btn:active{transform:scale(.97);}
  .progress-dots{display:flex;gap:6px;justify-content:center;margin:2px 0 12px;}
  .dot{width:9px;height:9px;border-radius:var(--radius-pill);background:#e3d6ba;transition:all .25s var(--ease-out);}
  .dot.on{background:var(--gold-deep);width:24px;}
  .dot.done{background:var(--green);}

  /* ---------- Memory ---------- */
  .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  .mcard{aspect-ratio:1/1;border-radius:var(--radius-sm);cursor:pointer;position:relative;
    perspective:600px;background:transparent;border:none;padding:0;}
  .mcard .inner{position:absolute;inset:0;transition:transform .45s var(--ease);transform-style:preserve-3d;}
  .mcard.flip .inner{transform:rotateY(180deg);}
  .mface{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    border-radius:var(--radius-sm);backface-visibility:hidden;font-size:34px;box-shadow:var(--shadow-sm);}
  .mfront{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;font-size:26px;}
  .mback{background:var(--white);border:2px solid var(--gold);transform:rotateY(180deg);}
  .mcard.matched .mback{border-color:var(--green);background:rgba(63,140,119,.12);box-shadow:var(--shadow-green);}

  /* ---------- Coloring ---------- */
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:10px;}
  .cat-card{
    border:1px solid var(--line);cursor:pointer;text-align:center;font-family:inherit;color:var(--ink);
    background:linear-gradient(180deg,var(--cream-2),var(--white));border-radius:var(--radius-lg);
    padding:24px 10px 18px;box-shadow:var(--shadow-md);
    transition:transform .16s var(--ease-out), box-shadow .16s;
  }
  .cat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);}
  .cat-card:active{transform:scale(.96);box-shadow:var(--shadow-press);}
  .cat-emoji{font-size:44px;}
  .cat-name{font-weight:700;font-size:17px;margin-top:9px;}
  .cat-count{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .color-empty{text-align:center;padding:40px 16px;background:linear-gradient(180deg,var(--cream-2),var(--white));border-radius:var(--radius-lg);border:1px solid var(--line);box-shadow:var(--shadow-sm);}
  .color-empty-emoji{font-size:56px;}
  .color-empty p{font-family:'Sarabun',sans-serif;color:var(--ink-soft);font-size:15px;line-height:1.7;margin:10px 0 0;}

  .color-editor{margin-top:2px;}
  .color-stage{background:var(--white);border-radius:var(--radius-lg);padding:12px;box-shadow:var(--shadow-md);border:1px solid var(--line);position:relative;}
  .color-viewport{position:relative;overflow:hidden;border-radius:var(--radius-md);touch-action:none;}
  .canvas-layer{position:relative;transform-origin:0 0;will-change:transform;}
  #fillCanvas{width:100%;height:auto;display:block;}
  #paintCanvas{position:absolute;inset:0;width:100%;height:100%;}
  .zoom-row{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;}
  .zoom-btn{border:1px solid var(--line);background:var(--white);border-radius:var(--radius-pill);
    min-width:44px;height:38px;padding:0 12px;cursor:pointer;font-family:inherit;font-size:15px;font-weight:700;
    color:var(--green-dark);box-shadow:var(--shadow-xs);transition:transform .12s var(--ease-out);}
  .zoom-btn:active{transform:scale(.9);}
  .zoom-btn.wide{font-size:13px;}
  .zoom-label{font-size:13px;font-weight:700;color:var(--ink-soft);min-width:46px;text-align:center;}
  .palette{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px;}
  .swatch{width:32px;height:32px;border-radius:50%;border:3px solid var(--white);box-shadow:var(--shadow-sm);cursor:pointer;transition:transform .15s var(--ease-out);}
  .swatch:hover{transform:scale(1.08);}
  .swatch:active{transform:scale(.85);}
  .swatch.sel{outline:3px solid var(--ink);outline-offset:2px;transform:scale(1.14);}
  .color-actions{display:flex;gap:10px;margin-top:14px;}
  .color-actions button{flex:1;}
  .pic-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 4px;}
  .pic-card{border:2px solid var(--line);border-radius:var(--radius-md);background:var(--white);
    padding:8px 6px 10px;cursor:pointer;text-align:center;box-shadow:var(--shadow-xs);font-family:inherit;
    transition:transform .12s var(--ease-out), box-shadow .15s, border-color .15s;}
  .pic-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-sm);border-color:var(--green);}
  .pic-card:active{transform:scale(.96);}
  .pic-card img{width:100%;aspect-ratio:1/1;object-fit:contain;display:block;}
  .pic-card .pic-name{font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:6px;}

  .tool-row{display:flex;gap:8px;margin-top:14px;}
  .tool-btn{flex:1;border:1px solid var(--line);background:var(--white);border-radius:var(--radius-md);
    padding:13px 6px;cursor:pointer;display:flex;align-items:center;justify-content:center;
    color:var(--ink-soft);box-shadow:var(--shadow-xs);transition:all .15s var(--ease-out);}
  .tool-btn:active{transform:scale(.93);}
  .tool-btn.sel{background:linear-gradient(135deg,var(--green),var(--green-dark));border-color:transparent;
    box-shadow:var(--shadow-green);color:#fff;}
  .tool-ico{width:26px;height:26px;display:block;}
  /* ถาดปากกา — อันที่เลือกจะยกขึ้นมาเหมือนหยิบออกจากกล่องสี */
  .tip-row{display:flex;gap:12px;justify-content:center;align-items:flex-end;margin-top:14px;
    padding:12px 14px 0;overflow:hidden;border-radius:var(--radius-md) var(--radius-md) 0 0;
    background:linear-gradient(180deg,transparent,rgba(63,140,119,.09));}
  .tip-btn{border:none;background:none;padding:0;cursor:pointer;line-height:0;color:inherit;
    transform:translateY(12px);transition:transform .2s var(--ease);}
  .tip-btn.sel{transform:translateY(-3px);}
  .tip-btn:active{transform:translateY(-3px) scale(.94);}
  .tip-btn .pen{width:38px;height:63px;display:block;fill:currentColor;
    filter:drop-shadow(0 3px 5px rgba(58,96,82,.28));}

  /* ---------- Stories ---------- */
  .story-card{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    border:1px solid var(--line);cursor:pointer;font-family:inherit;color:var(--ink);
    background:linear-gradient(180deg,var(--cream-2),var(--white));border-radius:var(--radius-md);padding:16px 40px 16px 16px;margin-bottom:12px;
    box-shadow:var(--shadow-sm);transition:transform .15s var(--ease-out), box-shadow .15s;position:relative;
  }
  .story-card:hover{transform:translateX(2px);box-shadow:var(--shadow-md);}
  .story-card:active{transform:scale(.97);}
  .story-card .scene{position:relative;overflow:hidden;font-size:34px;flex:0 0 auto;width:64px;height:64px;border-radius:var(--radius-sm);
    display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,rgba(239,206,134,.38),rgba(239,206,134,.14));box-shadow:inset 0 -2px 6px rgba(0,0,0,.04);}
  .story-card .scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
  .story-card .st{font-weight:700;font-size:18px;}
  .story-card .ss{font-size:13px;color:var(--ink-soft);margin-top:2px;}
  .story-card::after{content:'\203A';position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:24px;color:var(--ink-faint);font-weight:700;}
  .lesson{background:linear-gradient(135deg,rgba(63,140,119,.10),rgba(127,201,179,.08));border-radius:var(--radius-md);padding:13px 16px;margin:10px 20px 2px;border-left:4px solid var(--green);}
  .lesson .lt{font-weight:700;color:var(--green-dark);margin-bottom:5px;}
  .lesson p{margin:0;font-size:15px;line-height:1.75;}

  /* ---------- Story popup (carousel) ---------- */
  .story-modal{position:fixed;inset:0;z-index:80;display:none;}
  .story-modal.open{display:block;}
  .story-modal-backdrop{position:absolute;inset:0;background:rgba(40,54,48,.55);backdrop-filter:blur(2px);animation:fadein .2s var(--ease-out);}
  /* อ่านเต็มจอเหมือนหนังสือนิทาน: หัวเรื่องอยู่บน ภาพ+ข้อความเลื่อนตรงกลาง ปุ่มเปิดหน้าอยู่ล่างเสมอ */
  .story-modal-card{
    position:relative;width:100%;height:100%;display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,var(--cream-2),var(--white));
    animation:bookIn .3s var(--ease-out);touch-action:pan-y;
  }
  @keyframes bookIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
  .story-modal-close{
    position:absolute;top:calc(10px + env(safe-area-inset-top));right:12px;z-index:5;border:none;background:var(--white);
    width:38px;height:38px;border-radius:50%;box-shadow:var(--shadow-sm);cursor:pointer;
    display:flex;align-items:center;justify-content:center;color:var(--ink-soft);
  }
  .story-modal-close:active{transform:scale(.9);}
  .story-modal-head{display:flex;align-items:center;gap:11px;flex:0 0 auto;
    padding:calc(12px + env(safe-area-inset-top)) 58px 11px 18px;border-bottom:1px solid var(--line);}
  .smh-emoji{font-size:32px;flex:0 0 auto;}
  .smh-title{font-weight:700;font-size:19px;color:var(--green-dark);}
  .smh-arabic{direction:rtl;color:var(--gold-deep);font-size:14px;font-weight:600;margin-top:1px;}
  .story-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    display:flex;flex-direction:column;scrollbar-width:none;-ms-overflow-style:none;}
  .story-scroll::-webkit-scrollbar{display:none;width:0;}
  .slide-art{
    position:relative;flex:1 1 auto;min-height:150px;overflow:hidden;margin-bottom:0;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,rgba(127,201,179,.22),rgba(239,206,134,.22));
  }
  .slide-art-emoji{font-size:64px;}
  .slide-art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .slide-text{font-family:'Sarabun',sans-serif;font-size:18px;line-height:1.9;color:var(--ink);
    margin:0;padding:16px 20px 4px;animation:fadein .25s var(--ease-out);}
  .story-stage{position:relative;perspective:1400px;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .story-page{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;}
  .slide-body{flex:0 0 auto;display:flex;flex-direction:column;padding-bottom:10px;}
  .story-page.flip-page{
    position:absolute;top:0;left:0;right:0;bottom:0;background:var(--cream-2);
    backface-visibility:hidden;transform-style:preserve-3d;box-shadow:0 10px 30px rgba(0,0,0,.18);
    transition:transform .5s cubic-bezier(.45,0,.2,1);z-index:3;
  }
  .flip-page.flip-next{transform-origin:left center;}
  .flip-page.flip-next.turning{transform:rotateY(-115deg);}
  .flip-page.flip-prev{transform-origin:right center;}
  .flip-page.flip-prev.turning{transform:rotateY(115deg);}
  .flip-page::after{content:"";position:absolute;inset:0;border-radius:inherit;opacity:0;transition:opacity .5s;pointer-events:none;}
  .flip-page.flip-next::after{background:linear-gradient(to right, transparent 45%, rgba(0,0,0,.28));}
  .flip-page.flip-prev::after{background:linear-gradient(to left, transparent 45%, rgba(0,0,0,.28));}
  .flip-page.turning::after{opacity:1;}
  .story-modal-nav{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:0 0 auto;
    padding:11px 18px calc(11px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
    background:var(--cream-2);}
  .story-nav-btn{
    border:1px solid var(--line);background:var(--white);color:var(--green-dark);
    width:50px;height:50px;border-radius:50%;box-shadow:var(--shadow-sm);cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:transform .15s var(--ease-out);flex:0 0 auto;
  }
  .story-nav-btn.primary{background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;border-color:transparent;box-shadow:var(--shadow-green);}
  .story-nav-btn:active{transform:scale(.9);}
  .story-dots{margin:0;}

  /* ---------- Coding game ---------- */
  .code-grid{display:grid;gap:6px;margin:10px auto 6px;justify-content:center;}
  .tile{width:52px;height:52px;background:var(--white);border:2px solid var(--line-strong);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:var(--shadow-xs);}
  .tile.goal{background:linear-gradient(135deg,rgba(239,206,134,.35),rgba(239,206,134,.15));border-color:var(--gold-deep);}
  .tile.wall{background:#cdb98f;border-color:#a8946a;font-size:24px;}
  .queue{min-height:46px;background:var(--white);border:2px dashed var(--line-strong);border-radius:var(--radius-md);padding:9px;margin:14px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;}
  .queue-empty{color:var(--ink-soft);font-size:14px;}
  .qchip{background:rgba(63,140,119,.14);border-radius:10px;padding:4px 9px;font-size:20px;}
  .arrow-pad{display:flex;flex-direction:column;align-items:center;gap:9px;margin:6px 0;}
  .arrow-pad>div{display:flex;gap:9px;}
  .apad{border:none;background:linear-gradient(135deg,var(--green),var(--green-dark));color:#fff;width:58px;height:52px;border-radius:var(--radius-sm);font-size:26px;cursor:pointer;box-shadow:var(--shadow-green);transition:transform .12s var(--ease-out);}
  .apad:hover{transform:translateY(-2px);}
  .apad:active{transform:scale(.9);}
  .tile img{width:76%;height:76%;object-fit:contain;}
  .tile.star-tile{background:linear-gradient(135deg,rgba(239,206,134,.28),rgba(255,255,255,.6));border-color:var(--gold);}
  .inline-ico{width:22px;height:22px;object-fit:contain;vertical-align:-5px;}
  .qchip b{font-size:15px;color:var(--green-dark);margin-left:1px;}
  .lvl-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:10px 0 16px;}
  .lvl-card{position:relative;aspect-ratio:1/1;border:2px solid var(--line-strong);border-radius:var(--radius-sm);
    background:var(--white);cursor:pointer;font-family:inherit;padding:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;box-shadow:var(--shadow-xs);
    transition:transform .12s var(--ease-out),box-shadow .15s;}
  .lvl-card:not(.locked):active{transform:scale(.92);}
  .lvl-card.t1,.lvl-card.t2{border-color:rgba(127,201,179,.55);}
  .lvl-card.t3{border-color:rgba(169,221,240,.75);}
  .lvl-card.t4{border-color:rgba(239,206,134,.85);}
  .lvl-card.t5{border-color:rgba(233,169,138,.85);}
  .lvl-card.cleared{background:linear-gradient(160deg,rgba(127,201,179,.22),var(--white) 70%);}
  .lvl-card.locked{background:#f1ece2;border-color:transparent;box-shadow:none;cursor:not-allowed;}
  .lvl-card.locked .lvl-no,.lvl-card.locked .lvl-stars{opacity:.32;}
  .lvl-no{font-weight:700;font-size:17px;color:var(--green-dark);line-height:1;}
  .lvl-stars{display:flex;gap:1px;}
  .lvl-stars img{width:8px;height:8px;object-fit:contain;}
  .lvl-stars.sm img{width:13px;height:13px;}
  .lvl-tick{position:absolute;top:-5px;right:-5px;width:20px;height:20px;object-fit:contain;}
  .lvl-lock{position:absolute;top:3px;right:5px;font-size:12px;opacity:.55;}
  .lvl-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;}
  .lvl-back{border:1px solid var(--line);background:var(--white);color:var(--green-dark);font-family:inherit;
    font-weight:700;font-size:13px;padding:7px 13px;border-radius:var(--radius-pill);cursor:pointer;box-shadow:var(--shadow-xs);}
  .lvl-back:active{transform:scale(.94);}
  .code-goal{font-size:15px;font-weight:600;color:var(--green-dark);margin:2px 0 4px;}
  .chip-meter{font-size:13px;font-weight:700;color:var(--ink-soft);margin-top:10px;}
  .chip-meter.full{color:var(--coral-deep);}
  .rep-row{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:4px 0 2px;}
  .rep-label{font-size:13px;font-weight:700;color:var(--ink-soft);}
  .rep-btn{border:2px solid var(--line-strong);background:var(--white);color:var(--green-dark);font-family:inherit;
    font-weight:700;font-size:14px;width:42px;height:36px;border-radius:12px;cursor:pointer;box-shadow:var(--shadow-xs);
    transition:transform .12s var(--ease-out);}
  .rep-btn:active{transform:scale(.9);}
  .rep-btn.sel{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#5b4200;border-color:transparent;box-shadow:var(--shadow-gold);}
  .code-actions{display:flex;gap:8px;margin-top:14px;align-items:stretch;}
  .code-actions .ghost-btn,.code-actions .primary-btn{margin-top:0;flex:1;font-size:14px;padding:12px 6px;}
  .code-actions .primary-btn{flex:1.3;}
  /* ---------- Sequence memory ---------- */
  .seq-pads{display:grid;grid-template-columns:1fr 1fr;gap:14px;max-width:270px;margin:14px auto;}
  .spad{border:none;border-radius:var(--radius-lg);height:92px;font-size:42px;cursor:pointer;color:#fff;opacity:.55;transition:opacity .12s,transform .12s var(--ease-out),box-shadow .12s;box-shadow:var(--shadow-sm);}
  .spad.flash{opacity:1;transform:scale(1.07);box-shadow:var(--shadow-lg);}
  .spad:active{transform:scale(.95);}

  svg.lucide{width:24px;height:24px;stroke-width:2.1;vertical-align:middle;}
  .hero-wrap{width:100%;max-width:330px;margin:4px auto 0;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 14px 20px rgba(63,140,119,.18));}
  .hero-wrap svg{width:100%;height:auto;display:block;}
  .hero-duo{display:flex;align-items:flex-end;justify-content:center;}
  .moomoo-peek{display:flex;justify-content:center;margin-top:20px;}
  .moomoo-peek img{height:58px;width:auto;filter:drop-shadow(0 6px 10px rgba(63,140,119,.18));}
  .hero-wrap{position:relative;}
  .hero-glow{position:absolute;left:50%;top:50%;width:240px;height:240px;transform:translate(-50%,-50%);
    border-radius:50%;background:radial-gradient(circle,rgba(239,206,134,.5),rgba(127,201,179,.24) 55%,transparent 72%);
    animation:glowPulse 3.6s ease-in-out infinite;z-index:0;pointer-events:none;}
  @keyframes glowPulse{0%,100%{transform:translate(-50%,-50%) scale(.92);opacity:.75;}50%{transform:translate(-50%,-50%) scale(1.06);opacity:1;}}
  .hero-duo{position:relative;z-index:1;}
  .suhail-peek{position:absolute;right:-6px;bottom:8px;z-index:2;animation:float 2.8s ease-in-out infinite .4s;}
  .suhail-peek img{height:50px;width:auto;filter:drop-shadow(0 6px 10px rgba(63,140,119,.25));}

  .confetti{position:fixed;top:-10px;font-size:22px;pointer-events:none;z-index:60;animation:fall 2.4s linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:0;}}

  .footer-note{text-align:center;color:var(--ink-soft);font-size:12px;margin-top:30px;letter-spacing:.2px;}

  /* ---------- Responsive: tablet / iPad ---------- */
  @media (min-width:700px){
    #app{max-width:680px;}
    .hub-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));}
    .cat-grid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));}
    .game-wrap{max-width:480px;margin-left:auto;margin-right:auto;}
    .color-editor{max-width:520px;margin-left:auto;margin-right:auto;}
    .story-modal-card{max-width:720px;margin:0 auto;box-shadow:var(--shadow-lg);}
    .slide-text,.lesson{max-width:52ch;margin-left:auto;margin-right:auto;}
    .brand{font-size:32px;}
    .tagline{font-size:16px;}
  }
  @media (min-width:1000px){
    #app{max-width:760px;}
  }
</style>
</head>
<body>
<div id="app">

  <!-- ===== HOME ===== -->
  <section id="home" class="screen active">
    <div class="home-head">
      <div class="sparkle-field">
        <span style="top:6%;left:10%;animation-delay:0s;">✨</span>
        <span style="top:14%;right:8%;animation-delay:.6s;">⭐</span>
        <span style="top:46%;left:4%;animation-delay:1.2s;">💫</span>
        <span style="top:52%;right:6%;animation-delay:.3s;">✨</span>
        <span style="top:78%;left:14%;animation-delay:1.6s;">⭐</span>
        <span style="top:82%;right:16%;animation-delay:.9s;">💫</span>
      </div>
      <p class="bismillah">بِسْمِ اللَّهِ</p>
      <p class="bismillah-th">เริ่มต้นด้วยพระนามของอัลลอฮ์</p>
      <div class="hero-glow"></div>
      <div class="hero-wrap" id="hero"></div>
      <h1 class="brand">อามีน กับ อัลลีน</h1>
      <p class="tagline">เล่นเกม ระบายสี อ่านนิทาน สนุกทุกวัน ✨</p>
    </div>
    <div class="rail">
      <div class="rail-head">
        <span class="rail-title">🧠 เกมฝึกไอคิว</span>
        <button class="rail-all" onclick="go('iqhub')">ดูทั้งหมด ›</button>
      </div>
      <div class="rail-track" id="railGames"></div>
    </div>
    <div class="rail">
      <div class="rail-head">
        <span class="rail-title">📖 นิทาน</span>
        <button class="rail-all" onclick="go('storyhub')">ดูทั้งหมด ›</button>
      </div>
      <div class="rail-track" id="railStories"></div>
    </div>
    <div class="rail">
      <div class="rail-head">
        <span class="rail-title">🎨 ภาพระบายสี</span>
        <button class="rail-all" onclick="go('colorhub')">ดูทั้งหมด ›</button>
      </div>
      <div class="rail-track" id="railColor"></div>
    </div>
    <div class="moomoo-peek"><img src="/Moomoo_Sprites/03_Poses/14_sit.png" alt="มูมู"></div>
    <p class="footer-note">สำหรับเด็ก 3–10 ปี • เล่นได้ทุกอุปกรณ์</p>
  </section>

  <!-- ===== IQ HUB ===== -->
  <section id="iqhub" class="screen">
    <div class="topbar"><button class="back-btn" onclick="go('home')"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>กลับ</span></button><h2>ฝึกไอคิว</h2></div>
    <div class="hub-grid" id="iqGrid"></div>
  </section>

  <!-- ===== GAME SCREEN ===== -->
  <section id="game" class="screen">
    <div class="topbar">
      <button class="back-btn" onclick="go('iqhub')"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>กลับ</span></button>
      <h2 id="gameTitle"></h2>
      <div class="spacer"></div>
      <div class="score-pill"><img src="/icon-web/ui/01_star_filled.png" alt="" style="width:18px;height:18px;object-fit:contain;"> <span id="gameScore">0</span></div>
    </div>
    <div class="progress-dots" id="dots"></div>
    <div class="game-wrap" id="gameArea"></div>
    <div class="noor-say" id="noorSay" style="display:none"></div>
  </section>

  <!-- ===== COLOR HUB ===== -->
  <section id="colorhub" class="screen">
    <div class="topbar"><button class="back-btn" onclick="colorBack()"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>กลับ</span></button><h2 id="colorTitle">ระบายสี</h2></div>
    <div class="cat-grid" id="colorCats"></div>
    <div class="color-editor" id="colorEditor" style="display:none">
      <div class="pic-grid" id="picGrid" style="display:none"></div>
      <div class="color-stage" id="colorStage">
        <div class="color-viewport" id="colorViewport">
          <div class="canvas-layer" id="canvasLayer">
            <canvas id="fillCanvas"></canvas>
            <canvas id="paintCanvas"></canvas>
          </div>
        </div>
      </div>
      <div class="zoom-row" id="zoomRow">
        <button class="zoom-btn" onclick="zoomBy(1/1.45)" aria-label="ย่อ">➖</button>
        <span class="zoom-label" id="zoomLabel">100%</span>
        <button class="zoom-btn" onclick="zoomBy(1.45)" aria-label="ขยาย">➕</button>
        <button class="zoom-btn wide" onclick="zoomReset()">↺ เต็มรูป</button>
      </div>
      <div class="tool-row" id="toolRow"></div>
      <div class="tip-row" id="tipRow"></div>
      <div class="palette" id="palette"></div>
      <div class="color-actions" id="colorActions">
        <button class="ghost-btn" onclick="clearColors()">🧽 เริ่มใหม่</button>
        <button class="primary-btn" style="margin-top:0" onclick="celebrate()">✅ เสร็จแล้ว!</button>
      </div>
      <div class="color-empty" id="colorEmpty" style="display:none">
        <div class="color-empty-emoji">🎨</div>
        <p>ยังไม่มีรูปในหมวดนี้<br>เร็ว ๆ นี้!</p>
      </div>
    </div>
  </section>

  <!-- ===== STORY HUB ===== -->
  <section id="storyhub" class="screen">
    <div class="topbar"><button class="back-btn" onclick="storyBack()"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg><span>กลับ</span></button><h2 id="storyTitle">นิทาน</h2></div>
    <div class="cat-grid" id="storyCats"></div>
    <div id="storyListWrap" style="display:none">
      <div id="storyList"></div>
    </div>

</div>

<!-- ===== STORY POPUP (carousel) ===== -->
<div class="story-modal" id="storyModal">

  <div class="story-modal-card" id="storyModalCard">
    <button class="story-modal-close" onclick="closeStoryModal()"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    <div class="story-modal-head">
      <span class="smh-emoji" id="storyModalEmoji"></span>
      <div>
        <div class="smh-title" id="storyModalTitle"></div>
        <div class="smh-arabic" id="storyModalArabic"></div>
      </div>

      <div class="story-stage" id="storyStage">
        <div class="story-page" id="storyPageBase"></div>
      </div>

      <button class="story-nav-btn" id="storyPrevBtn" onclick="storyPrev()" aria-label="หน้าก่อน"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>
      <div class="story-dots progress-dots" id="storyModalDots"></div>
      <button class="story-nav-btn primary" id="storyNextBtn" onclick="storyNext()"><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></button>
    </div>
  </div>
</div>

<script>
/* ============ Characters ============ */
function charImg(folder,file,size,alt){
  return `<img src="/${folder}_Sprites/${file}" style="height:${size}px;width:auto;display:inline-block;vertical-align:middle;" alt="${alt}">`;
}
function suhail(size,file){return charImg('Suhail',file||'02_Expressions/06_smile.png',size,'ซูฮัยล์');}
function ameen(size,file){return charImg('Ameen',file||'00_hero_main.png',size,'อามีน');}
function alleen(size,file){return charImg('Alleen',file||'00_hero_main.png',size,'อัลลีน');}
function moomoo(size,file){return charImg('Moomoo',file||'00_hero_main.png',size,'มูมู');}

document.getElementById('hero').innerHTML = `
  <div class="hero-duo">
    ${alleen(168)}
    <img src="/Ameen_Sprites/00_hero_main.png" alt="อามีน" style="height:168px;width:auto;margin-left:-16px;">
  </div>
  <div class="suhail-peek"><img src="/Suhail_Sprites/03_Poses/15_wave.png" alt="ซูฮัยล์"></div>`;

/* ============ Navigation ============ */
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

/* ============ Confetti + celebrate ============ */
function confetti(){
  const e=['⭐','🌟','✨','🎉','💛','🟢','ui/05_confetti_burst.png','ui/01_star_filled.png'];

/* --- Odd one out --- */
function renderOdd(){
  const lvl=G.round;
  const area=document.getElementById('gameArea');area.style.textAlign='center';

  else{[same,diff]=pick(emojiSet,2);}

  items[oddIdx]=diff;
  area.innerHTML=`<div class="prompt">อันไหน "ไม่เหมือน" เพื่อน?</div><div class="choices g3" id="ch"></div>`;
  const ch=document.getElementById('ch');
  items.forEach((e,i)=>{
    const b=document.createElement('button');b.className='opt';b.innerHTML=ico(e);
    b.onclick=()=>{
      if(i===oddIdx){b.classList.add('correct');noor(praises[Math.floor(Math.random()*praises.length)]);nextRound(true);}
      else{b.classList.add('wrong');noor('ลองอีกที เพ่งดูดี ๆ นะ 👀');document.querySelectorAll('#ch .opt')[oddIdx].classList.add('correct');nextRound(false);}
      disable('#ch');
    };
    ch.appendChild(b);
  });
}

/* --- Pattern sequence --- */
function renderPattern(){
  const lvl=G.round;
  const area=document.getElementById('gameArea');area.style.textAlign='center';
  const period=lvl<3?2:lvl<6?3:(Math.random()<.5?3:4);
  const syms=pick(emojiSet,period);
  let cycle;
  if(period===2)cycle=[syms[0],syms[1]];
  else if(period===3)cycle=Math.random()<.5?[syms[0],syms[1],syms[2]]:[syms[0],syms[0],syms[1]];
  else cycle=[syms[0],syms[1],syms[0],syms[2]];
  const seqLen=Math.min(cycle.length*(lvl<6?3:2)+(lvl>=6?2:0),8);
  let full=[];while(full.length<seqLen+1)full=full.concat(cycle);
  full=full.slice(0,seqLen+1);
  const ans=full[seqLen];const shown=full.slice(0,seqLen);
  let seqHtml='';shown.forEach(s=>seqHtml+=`<div>${ico(s)}</div>`);seqHtml+='<div class="q">?</div>';
  const nOpt=lvl>=6?4:3;
  const others=pick(emojiSet.filter(e=>e!==ans),nOpt-1);
  const opts=shuffle([ans,...others]);
  area.innerHTML=`<div class="prompt">อะไรมาต่อไป?</div><div class="seq">${seqHtml}</div><div class="choices ${nOpt===4?'g2':'g3'}" id="ch"></div>`;
  const ch=document.getElementById('ch');
  opts.forEach(o=>{
    const btn=document.createElement('button');btn.className='opt';btn.innerHTML=ico(o);
    btn.onclick=()=>{
      if(o===ans){btn.classList.add('correct');noor(praises[Math.floor(Math.random()*praises.length)]);nextRound(true);}
      else{btn.classList.add('wrong');noor('ดูจังหวะของรูปดี ๆ นะ 😊');nextRound(false);}
      disable('#ch');
    };
    ch.appendChild(btn);
  });
}

/* --- Memory match (10 levels) --- */
function renderMemory(pool){
  if(pool)G.pool=pool;
  const activePool=G.pool||emojiSet;
  const lvl=G.round;
  updateDots();
  document.getElementById('noorSay').style.display='none';
  const area=document.getElementById('gameArea');area.style.textAlign='left';
  const pairs=Math.min(3+Math.floor(lvl/2),8);
  const icons=pick(activePool,pairs);
  const deck=shuffle([...icons,...icons]);
  const cols=deck.length<=6?3:4;
  let flipped=[],matched=0,lock=false;
  area.innerHTML=`<div class="prompt">ด่าน ${lvl+1}/10 — พลิกหาคู่ที่เหมือนกัน</div><div class="mem-grid" id="mgrid" style="grid-template-columns:repeat(${cols},1fr)"></div>`;
  const grid=document.getElementById('mgrid');
  deck.forEach((icon)=>{
    const card=document.createElement('button');card.className='mcard';
    card.innerHTML=`<div class="inner"><div class="mface mfront"><img class="cardback-img" src="${ICON_BASE}ui/01_card_back_pattern.png" alt=""></div><div class="mface mback">${ico(icon)}</div></div>`;
    card.onclick=()=>{
      if(lock||card.classList.contains('flip')||card.classList.contains('matched'))return;
      card.classList.add('flip');flipped.push({card,icon});
      if(flipped.length===2){
        lock=true;
        if(flipped[0].icon===flipped[1].icon){
          setTimeout(()=>{flipped.forEach(f=>f.card.classList.add('matched'));flipped=[];lock=false;matched++;
            if(matched===pairs){
              G.score++;document.getElementById('gameScore').textContent=G.score;confetti();
              noor(praises[Math.floor(Math.random()*praises.length)]);
              G.round++;
              if(G.round>=10){setTimeout(finishGame,900);}else{setTimeout(renderMemory,950);}
            } else {
              noor(praises[Math.floor(Math.random()*praises.length)]);
            }
          },520);
        } else {
          setTimeout(()=>{flipped.forEach(f=>f.card.classList.remove('flip'));flipped=[];lock=false;noor('ยังไม่ใช่คู่ จำตำแหน่งไว้นะ 🧠');},850);
        }
      }
    };
    grid.appendChild(card);
  });
}

function drawGrid(L,pos,got){
  const g=document.getElementById('codeGrid');
  if(!g)return;
  const gap=L.w>=7?4:6;
  const size=Math.max(30,Math.min(52,Math.floor((290-gap*(L.w-1))/L.w)));
  g.style.gap=gap+'px';
  g.style.gridTemplateColumns=`repeat(${L.w},${size}px)`;
  g.innerHTML='';
  for(let y=0;y<L.h;y++)for(let x=0;x<L.w;x++){
    const t=document.createElement('div');t.className='tile';
    t.style.width=size+'px';t.style.height=size+'px';t.style.fontSize=Math.round(size*0.5)+'px';
    if(L.walls.some(w=>w.x===x&&w.y===y)){t.classList.add('wall');t.textContent='🧱';}
    else if(L.goal.x===x&&L.goal.y===y){t.classList.add('goal');t.innerHTML='<img src="/icon-web/islamic/01_mosque.png" alt="">';}
    else if((L.stars||[]).some(s=>s.x===x&&s.y===y)){
      const taken=got.some(s=>s.x===x&&s.y===y);
      t.classList.add('star-tile');
      t.innerHTML=`<img src="/icon-web/ui/${taken?'02_star_empty':'01_star_filled'}.png" alt="">`;
    }
    if(pos.x===x&&pos.y===y)t.innerHTML=ameen(Math.round(size*0.74),'03_Poses/18_walk.png');
    g.appendChild(t);
  }
}
function setRep(n){

function addCmd(d){
  if(CODE.running)return;
  const L=codeLevels[CODE.lvl];
  if(CODE.queue.length>=L.max){noor(L.t>=4?'บล็อกเต็มแล้ว! ลองใช้ 🔁 ทำซ้ำ ช่วยนะ':'บล็อกเต็มแล้ว ลองล้างแล้ววางแผนใหม่นะ');return;}
  CODE.queue.push({d,n:CODE.rep});
  renderQueue();
}
function undoCmd(){if(CODE.running)return;CODE.queue.pop();renderQueue();}
function clearQueue(){
  if(CODE.running)return;

function renderQueue(){
  const q=document.getElementById('queue');const m={up:'⬆️',down:'⬇️',left:'⬅️',right:'➡️'};
  q.innerHTML=CODE.queue.length
    ?CODE.queue.map(c=>`<span class="qchip">${m[c.d]}${c.n>1?`<b>×${c.n}</b>`:''}</span>`).join('')
    :'<span class="queue-empty">กดลูกศรเพื่อสั่งทาง…</span>';
  const cc=document.getElementById('chipCount');
  if(cc){cc.textContent=CODE.queue.length;cc.parentElement.classList.toggle('full',CODE.queue.length>=codeLevels[CODE.lvl].max);}

function runCode(){
  if(CODE.running||!CODE.queue.length)return;
  CODE.running=true;
  const L=codeLevels[CODE.lvl];
  const steps=[];
  CODE.queue.forEach(c=>{for(let k=0;k<c.n;k++)steps.push(c.d);});
  let pos={x:L.start.x,y:L.start.y};const got=[];let i=0;
  noor('อามีนกำลังเดิน… 👣');
  const step=()=>{
    if(i>=steps.length){finishCoding(pos,L,got);return;}
    const c=steps[i];let nx=pos.x,ny=pos.y;
    if(c==='up')ny--;else if(c==='down')ny++;else if(c==='left')nx--;else if(c==='right')nx++;
    if(nx<0||ny<0||nx>=L.w||ny>=L.h||L.walls.some(w=>w.x===nx&&w.y===ny)){
      CODE.running=false;noor('อุ๊ย ชนกำแพง! ลองวางแผนใหม่นะ 🧱');
      setTimeout(()=>drawGrid(L,L.start,[]),700);return;
    }
    pos={x:nx,y:ny};
    if((L.stars||[]).some(s=>s.x===nx&&s.y===ny)&&!got.some(s=>s.x===nx&&s.y===ny))got.push({x:nx,y:ny});
    drawGrid(L,pos,got);i++;setTimeout(step,340);
  };
  setTimeout(step,300);
}
function finishCoding(pos,L,got){
  CODE.running=false;
  const need=(L.stars||[]).length;
  if(pos.x!==L.goal.x||pos.y!==L.goal.y){noor('เกือบแล้ว! อามีนยังไม่ถึงมัสยิด ลองใหม่นะ 😊');return;}
  if(got.length<need){noor('ยังเก็บดาวไม่ครบนะ ⭐ ลองใหม่!');return;}
  confetti();noor(praises[Math.floor(Math.random()*praises.length)]);
  saveCodeProgress(CODE.lvl+1);
  if(CODE.lvl>=codeLevels.length-1){
    setTimeout(()=>{

      area.innerHTML=`${suhail(90,'02_Expressions/13_proud.png')}<div class="prompt" style="text-align:center;margin-top:8px">เก่งมาก! ผ่านครบ ${codeLevels.length} ด่าน 🎉</div>

      document.getElementById('noorSay').style.display='none';
    },1100);
  } else {
    setTimeout(()=>{CODE.lvl++;renderCoding();},1200);
  }
}

function playSeq(){
  SEQ.busy=true;noor('ดูให้ดีนะ… 👀');

  const t=setInterval(()=>{

    pads[SEQ.order[i]].classList.add('flash');i++;

function seqTap(idx){
  if(SEQ.busy)return;
  const pads=[...document.querySelectorAll('.spad')];
  pads[idx].classList.add('flash');setTimeout(()=>pads[idx].classList.remove('flash'),230);
  SEQ.input.push(idx);const pos=SEQ.input.length-1;
  if(SEQ.input[pos]!==SEQ.order[pos]){
    SEQ.busy=true;noor('ยังไม่ตรง ลองดูใหม่นะ 😊');
    setTimeout(()=>{SEQ.input=[];playSeq();},1100);return;
  }
  if(SEQ.input.length===SEQ.order.length){
    SEQ.busy=true;G.score++;document.getElementById('gameScore').textContent=G.score;
    noor(praises[Math.floor(Math.random()*praises.length)]);G.round++;
    if(G.round>=G.total)setTimeout(finishGame,1000);
    else setTimeout(nextSeqRound,1100);
  }
}
function replaySeq(){if(SEQ.busy)return;SEQ.input=[];playSeq();}

/* ============ MATH (คณิตคิดเร็ว) ============ */
function renderMath(){
  const lvl=G.round;
  const area=document.getElementById('gameArea');area.style.textAlign='center';
  let a,b,op,ans;
  if(lvl<3){op='+';a=1+Math.floor(Math.random()*(3+lvl));b=1+Math.floor(Math.random()*(3+lvl));ans=a+b;}
  else if(lvl<6){
    if(Math.random()<.5){op='+';a=1+Math.floor(Math.random()*9);b=1+Math.floor(Math.random()*9);ans=a+b;}
    else{op='−';a=3+Math.floor(Math.random()*9);b=1+Math.floor(Math.random()*a);ans=a-b;}
  } else {
    const r=Math.random();
    if(r<.34){op='+';a=5+Math.floor(Math.random()*10);b=5+Math.floor(Math.random()*10);ans=a+b;}
    else if(r<.67){op='−';a=8+Math.floor(Math.random()*12);b=1+Math.floor(Math.random()*a);ans=a-b;}
    else{op='×';a=2+Math.floor(Math.random()*4);b=2+Math.floor(Math.random()*5);ans=a*b;}
  }
  const pool=[];for(let d=-4;d<=4;d++){const v=ans+d;if(v>=0&&v!==ans)pool.push(v);}
  const opts=shuffle([ans,...pick([...new Set(pool)],3)]);
  area.innerHTML=`<div class="prompt" style="font-size:30px">${a} ${op} ${b} = ?</div><div class="choices g2" id="ch"></div>`;
  const ch=document.getElementById('ch');
  opts.forEach(o=>{
    const btn=document.createElement('button');btn.className='opt num';btn.textContent=o;
    btn.onclick=()=>{
      if(o===ans){btn.classList.add('correct');noor(praises[Math.floor(Math.random()*praises.length)]);nextRound(true);}
      else{btn.classList.add('wrong');noor('ลองคิดใหม่นะ ค่อย ๆ นับ 😊');nextRound(false);}
      disable('#ch');
    };
    ch.appendChild(btn);
  });
}

/* ============ MORE OR LESS (มากหรือน้อย) ============ */
function renderMoreLess(){
  const lvl=G.round;
  const area=document.getElementById('gameArea');area.style.textAlign='center';
  const askMore=lvl<3?true:Math.random()<.5;
  const icon=pick(emojiSet,1)[0];
  const base=2+Math.floor(Math.random()*(3+lvl));
  const gap=lvl<3?(2+Math.floor(Math.random()*3)):lvl<7?(1+Math.floor(Math.random()*2)):1;
  let cA=base,cB=base+(Math.random()<.5?gap:-gap);
  if(cB<1)cB=base+gap;
  if(cA===cB)cB=cA+gap;
  const q=askMore?'กล่องไหนมี "มากกว่า"?':'กล่องไหนมี "น้อยกว่า"?';
  const correctBox=askMore?(cA>cB?'A':'B'):(cA<cB?'A':'B');
  const boxHtml=(letter,c)=>`<button class="opt" data-b="${letter}" style="min-height:120px;padding:14px;align-items:center"><div style="display:flex;flex-wrap:wrap;gap:5px;justify-content:center;font-size:23px;line-height:1.3">${Array(c).fill(ico(icon)).join('')}</div></button>`;
  area.innerHTML=`<div class="prompt">${q}</div><div class="choices g2" id="ch">${boxHtml('A',cA)}${boxHtml('B',cB)}</div>`;
  [...document.querySelectorAll('#ch .opt')].forEach(btn=>{
    btn.onclick=()=>{
      if(btn.dataset.b===correctBox){btn.classList.add('correct');noor(praises[Math.floor(Math.random()*praises.length)]);nextRound(true);}
      else{btn.classList.add('wrong');noor('ลองนับจำนวนในแต่ละกล่องดูนะ 🔢');document.querySelector('#ch .opt[data-b="'+correctBox+'"]').classList.add('correct');nextRound(false);}
      disable('#ch');
    };
  });
}

function loadPic(){
  const pic=picLib[curCat][curPic];
  if(!pic)return;
  const token=++PAINT.loadToken;
  const img=new Image();
  img.onload=()=>{
    if(token!==PAINT.loadToken)return; // เด็กกดเปลี่ยนรูประหว่างโหลด — ทิ้งรูปเก่าไป
    const maxSide=900;
    const scale=Math.min(1,maxSide/Math.max(img.naturalWidth,img.naturalHeight));
    const cw=Math.max(1,Math.round(img.naturalWidth*scale));
    const ch=Math.max(1,Math.round(img.naturalHeight*scale));
    const fillCanvas=document.getElementById('fillCanvas');
    fillCanvas.width=cw;fillCanvas.height=ch;
    const fctx=fillCanvas.getContext('2d');
    fctx.drawImage(img,0,0,cw,ch);
    // binarize to pure black/white so the outline is a solid, gap-free wall for the flood fill
    const id=fctx.getImageData(0,0,cw,ch);
    const d=id.data;
    const ink=new Uint8Array(cw*ch);
    for(let i=0,p=0;i<d.length;i+=4,p++){
      const v=(d[i]+d[i+1]+d[i+2])/3<180?0:255;
      d[i]=v;d[i+1]=v;d[i+2]=v;d[i+3]=255;
      ink[p]=v?1:0; // 1 = ระบายได้, 0 = เส้นขอบสีดำ (ห้ามทับ)
    }
    fctx.putImageData(id,0,0);
    PAINT.regions=buildRegions(ink,cw,ch);
    PAINT.region=0;
    const paint=document.getElementById('paintCanvas');
    paint.width=cw;paint.height=ch;
    paint.getContext('2d').clearRect(0,0,cw,ch);
    zoomReset();
  };
  img.src=pic.src;
}

function hexToRgb(hex){
  const n=parseInt(hex.slice(1),16);
  return [(n>>16)&255,(n>>8)&255,n&255];
}
/* แบ่งรูปเป็น "ช่อง" ทีเดียวตอนโหลด โดยใช้เส้นดำเป็นขอบเขต
   ทั้งถังเทสีและแปรงใช้ช่องชุดเดียวกัน สีจึงไม่มีทางล้นออกนอกเส้น */
function buildRegions(ink,w,h){
  const reg=new Int32Array(w*h);
  const stack=new Int32Array(w*h);
  let next=1;
  for(let seed=0;seed<reg.length;seed++){
    if(!ink[seed]||reg[seed])continue;
    const id=next++;
    let sp=0;stack[sp++]=seed;reg[seed]=id;
    while(sp){
      const q=stack[--sp],x=q%w;
      if(x>0&&ink[q-1]&&!reg[q-1]){reg[q-1]=id;stack[sp++]=q-1;}
      if(x<w-1&&ink[q+1]&&!reg[q+1]){reg[q+1]=id;stack[sp++]=q+1;}
      if(q>=w&&ink[q-w]&&!reg[q-w]){reg[q-w]=id;stack[sp++]=q-w;}
      if(q+w<reg.length&&ink[q+w]&&!reg[q+w]){reg[q+w]=id;stack[sp++]=q+w;}
    }
  }
  return reg;
}
/* นิ้วเด็กแตะโดนเส้นบ่อย — ถ้าแตะโดนเส้น ให้หาช่องที่ใกล้ที่สุดแทน */
function regionAt(x,y){
  const reg=PAINT.regions,c=document.getElementById('fillCanvas');
  if(!reg||!c)return 0;
  const w=c.width,h=c.height;
  const at=(px,py)=>(px<0||py<0||px>=w||py>=h)?0:reg[py*w+px];
  const hit=at(x,y);
  if(hit)return hit;
  for(let r=2;r<=16;r+=2){
    const steps=r*6;
    for(let i=0;i<steps;i++){
      const t=i/steps*Math.PI*2;
      const id=at(Math.round(x+Math.cos(t)*r),Math.round(y+Math.sin(t)*r));
      if(id)return id;
    }
  }
  return 0;
}
function floodFillAt(ctx,x,y,hexColor){
  const id=regionAt(Math.round(x),Math.round(y));
  if(!id)return;
  const reg=PAINT.regions;
  const w=ctx.canvas.width,h=ctx.canvas.height;
  const imgData=ctx.getImageData(0,0,w,h);
  const data=imgData.data;
  const [fr,fg,fb]=hexToRgb(hexColor);
  for(let p=0;p<reg.length;p++){
    if(reg[p]!==id)continue;
    const i=p*4;data[i]=fr;data[i+1]=fg;data[i+2]=fb;data[i+3]=255;
  }
  ctx.putImageData(imgData,0,0);
}
/* ---- ซูม/เลื่อนรูป ---- */
function clampZoom(z){return Math.min(4,Math.max(1,z));}
function applyZoom(){
  const vp=document.getElementById('colorViewport');
  const layer=document.getElementById('canvasLayer');
  if(!vp||!layer)return;
  const W=vp.clientWidth,H=vp.clientHeight,z=PAINT.zoom;
  PAINT.panX=Math.min(0,Math.max(Math.min(0,W-W*z),PAINT.panX));
  PAINT.panY=Math.min(0,Math.max(Math.min(0,H-H*z),PAINT.panY));
  layer.style.transform=`translate(${PAINT.panX}px,${PAINT.panY}px) scale(${z})`;
  const label=document.getElementById('zoomLabel');
  if(label)label.textContent=Math.round(z*100)+'%';
}
function zoomAround(cx,cy,z){
  const k=z/PAINT.zoom;
  PAINT.panX=cx-(cx-PAINT.panX)*k;
  PAINT.panY=cy-(cy-PAINT.panY)*k;
  PAINT.zoom=z;
  applyZoom();
}
function zoomBy(f){
  const vp=document.getElementById('colorViewport');
  if(!vp)return;
  zoomAround(vp.clientWidth/2,vp.clientHeight/2,clampZoom(PAINT.zoom*f));
}
function zoomReset(){PAINT.zoom=1;PAINT.panX=0;PAINT.panY=0;applyZoom();}
function setupZoom(){
  const vp=document.getElementById('colorViewport');
  if(!vp)return;
  const pts=new Map();
  let pinch=null,pan=null;
  vp.addEventListener('pointerdown',e=>{
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){
      PAINT.drawing=false;PAINT.gesture=true;pan=null;
      const[a,b]=[...pts.values()];
      const r=vp.getBoundingClientRect();
      pinch={dist:Math.hypot(a.x-b.x,a.y-b.y)||1,zoom:PAINT.zoom,
        mx:(a.x+b.x)/2-r.left,my:(a.y+b.y)/2-r.top,px:PAINT.panX,py:PAINT.panY};
    } else if(pts.size===1&&PAINT.tool==='pan'){
      PAINT.gesture=true;
      pan={x:e.clientX,y:e.clientY,px:PAINT.panX,py:PAINT.panY};
      vp.setPointerCapture(e.pointerId);
    }
  });
  vp.addEventListener('pointermove',e=>{
    if(!pts.has(e.pointerId))return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size>=2&&pinch){
      const[a,b]=[...pts.values()];
      const z=clampZoom(pinch.zoom*(Math.hypot(a.x-b.x,a.y-b.y)/pinch.dist));
      const k=z/pinch.zoom;
      PAINT.panX=pinch.mx-(pinch.mx-pinch.px)*k;
      PAINT.panY=pinch.my-(pinch.my-pinch.py)*k;
      PAINT.zoom=z;
      applyZoom();
    } else if(pan&&PAINT.tool==='pan'){
      PAINT.panX=pan.px+(e.clientX-pan.x);
      PAINT.panY=pan.py+(e.clientY-pan.y);
      applyZoom();
    }
  });
  ['pointerup','pointercancel'].forEach(ev=>vp.addEventListener(ev,e=>{
    pts.delete(e.pointerId);
    if(pts.size<2)pinch=null;
    if(pts.size===0){pan=null;setTimeout(()=>{PAINT.gesture=false;},80);}
  }));
}
function setupFillCanvas(){
  const canvas=document.getElementById('fillCanvas');
  canvas.addEventListener('pointerdown',e=>{
    if(PAINT.tool!=='bucket'||PAINT.gesture)return;
    const r=canvas.getBoundingClientRect();
    const x=Math.floor((e.clientX-r.left)*(canvas.width/r.width));
    const y=Math.floor((e.clientY-r.top)*(canvas.height/r.height));
    floodFillAt(canvas.getContext('2d'),x,y,selColor);
  });
}
function setupPaintCanvas(){
  const canvas=document.getElementById('paintCanvas');
  canvas.width=600;canvas.height=520;
  const ctx=canvas.getContext('2d');
  ctx.lineCap='round';ctx.lineJoin='round';
  function posFromEvent(e){
    const r=canvas.getBoundingClientRect();
    return {x:(e.clientX-r.left)*(canvas.width/r.width), y:(e.clientY-r.top)*(canvas.height/r.height)};
  }
  /* ลบสีทุกจุดที่อยู่นอก "ช่อง" ที่เริ่มลงแปรง — เส้นดำจึงเป็นขอบเขตจริง ๆ */
  function clipToRegion(minX,minY,maxX,maxY){
    const reg=PAINT.regions;
    if(!reg||!PAINT.region)return;
    minX=Math.max(0,Math.floor(minX));minY=Math.max(0,Math.floor(minY));
    maxX=Math.min(canvas.width-1,Math.ceil(maxX));maxY=Math.min(canvas.height-1,Math.ceil(maxY));
    const w=maxX-minX+1,h=maxY-minY+1;
    if(w<=0||h<=0)return;
    const imgData=ctx.getImageData(minX,minY,w,h);
    const data=imgData.data;
    const cw=canvas.width,id=PAINT.region;
    for(let yy=0;yy<h;yy++){
      const row=(minY+yy)*cw+minX;
      for(let xx=0;xx<w;xx++){
        if(reg[row+xx]!==id)data[(yy*w+xx)*4+3]=0;
      }
    }
    ctx.putImageData(imgData,minX,minY);
  }
  function tipNow(){return brushTips[PAINT.tip]||brushTips[1];}
  function solid(x1,y1,x2,y2,rad){
    ctx.save();
    ctx.globalCompositeOperation=PAINT.tool==='eraser'?'destination-out':'source-over';
    if(x1===x2&&y1===y2){
      ctx.fillStyle=selColor;
      ctx.beginPath();ctx.arc(x1,y1,rad,0,Math.PI*2);ctx.fill();
    } else {
      ctx.strokeStyle=selColor;ctx.lineWidth=rad*2;
      ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    }
    ctx.restore();
  }
  /* สีเทียน: โปรยจุดเล็ก ๆ แบบสุ่มตามแนวลาก ให้ได้ผิวหยาบ ๆ */
  function rough(x1,y1,x2,y2,rad){
    const steps=Math.max(1,Math.round(Math.hypot(x2-x1,y2-y1)/2.5));
    const dots=Math.max(2,Math.round(rad/4));
    ctx.save();
    ctx.fillStyle=selColor;
    for(let i=0;i<=steps;i++){
      const t=i/steps,cx=x1+(x2-x1)*t,cy=y1+(y2-y1)*t;
      for(let k=0;k<dots;k++){
        const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*rad;
        ctx.globalAlpha=.35+Math.random()*.4;
        ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,rad*.22,0,Math.PI*2);ctx.fill();
      }
    }
    ctx.restore();
  }
  function stroke(x1,y1,x2,y2){
    const t=tipNow(),rad=t.size/2;
    if(t.rough&&PAINT.tool!=='eraser')rough(x1,y1,x2,y2,rad);
    else solid(x1,y1,x2,y2,rad);
    if(PAINT.tool==='brush'){
      const pad=rad+2;
      clipToRegion(Math.min(x1,x2)-pad,Math.min(y1,y2)-pad,Math.max(x1,x2)+pad,Math.max(y1,y2)+pad);
    }
  }
  canvas.addEventListener('pointerdown',e=>{
    if(PAINT.tool!=='brush'&&PAINT.tool!=='eraser')return;
    if(PAINT.gesture)return;
    const p=posFromEvent(e);
    if(PAINT.tool==='brush'){
      PAINT.region=regionAt(Math.round(p.x),Math.round(p.y));
      if(!PAINT.region)return; // แตะโดนเส้นล้วน ๆ หาช่องใกล้ ๆ ไม่เจอ
    }
    canvas.setPointerCapture(e.pointerId);
    PAINT.drawing=true;
    PAINT.lastX=p.x;PAINT.lastY=p.y;
    stroke(p.x,p.y,p.x,p.y);
  });
  canvas.addEventListener('pointermove',e=>{
    if(!PAINT.drawing)return;
    if(PAINT.gesture){PAINT.drawing=false;return;}
    const p=posFromEvent(e);stroke(PAINT.lastX,PAINT.lastY,p.x,p.y);PAINT.lastX=p.x;PAINT.lastY=p.y;
  });
  /* ไม่ดัก pointerleave เพราะจับ pointer capture ไว้แล้ว — เดิมทำให้เส้นขาดเวลานิ้วเลยขอบรูป */
  ['pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,()=>{PAINT.drawing=false;}));
}

const storyCategories=[
  {key:'prophets',name:'เรื่องเล่านบี',emoji:'📖'},
  {key:'goodkid',name:'นิทานเด็กดี',emoji:'🌟'},
];
const storyLib={prophets:stories,goodkid:goodKidStories};
let curStoryCat='prophets';

function initStoryHub(){
  document.getElementById('storyListWrap').style.display='none';
  document.getElementById('storyCats').style.display='grid';
  document.getElementById('storyTitle').textContent='นิทาน';
  renderStoryCats();
}
function renderStoryCats(){
  const wrap=document.getElementById('storyCats');wrap.innerHTML='';
  storyCategories.forEach(c=>{
    const b=document.createElement('button');b.className='cat-card';
    const count=storyLib[c.key].length;
    b.innerHTML=`<div class="cat-emoji">${c.emoji}</div><div class="cat-name">${c.name}</div><div class="cat-count">${count} เรื่อง</div>`;
    b.onclick=()=>openStoryCategory(c.key);
    wrap.appendChild(b);
  });
}
function openStoryCategory(key){
  curStoryCat=key;
  document.getElementById('storyCats').style.display='none';
  document.getElementById('storyListWrap').style.display='block';
  document.getElementById('storyTitle').textContent=storyCategories.find(c=>c.key===key).name;
  const list=document.getElementById('storyList');list.innerHTML='';
  storyLib[key].forEach(s=>{
    const b=document.createElement('button');b.className='story-card';
    b.innerHTML=`<div class="scene">${storyCover(key,s)}</div><div><div class="st">${s.title}</div><div class="ss">${s.sub}</div></div>`;
    b.onclick=()=>openStory(key,s.id);
    list.appendChild(b);
  });
}
function storyBack(){
  if(document.getElementById('storyListWrap').style.display!=='none'){initStoryHub();}
  else{go('home');}
}
/* ============ STORY POPUP (carousel) ============ */
let STORY_MODAL={cat:null,id:null,story:null,slide:0,total:1,flipping:false};
function storyImgPath(cat,id,n){return `/Story_Scenes/${cat}/${id}/slide-${n}.jpg`;}
/* ปกนิทาน = ภาพแรกของเรื่อง ถ้ารูปหายก็ตกไปใช้อิโมจิที่อยู่ข้างหลังแทน */
function storyCover(cat,s){
  return `<span class="rc-emoji">${s.scene}</span><img src="${storyImgPath(cat,s.id,1)}" loading="lazy" alt="" onerror="this.remove()">`;
}
function openStory(cat,id){
  const s=storyLib[cat].find(x=>x.id===id);
  STORY_MODAL={cat,id,story:s,slide:0,total:s.body.length,flipping:false};
  document.getElementById('storyModalEmoji').textContent=s.scene;
  document.getElementById('storyModalTitle').textContent=s.title;
  document.getElementById('storyModalArabic').textContent=s.arabic||'';
  document.getElementById('storyModalArabic').style.display=s.arabic?'block':'none';
  renderStorySlide();
  for(let n=1;n<=STORY_MODAL.total;n++){new Image().src=storyImgPath(cat,id,n);}
  document.getElementById('storyModal').classList.add('open');
  document.body.style.overflow='hidden'; // กันหน้าเว็บข้างหลังเลื่อนตามนิ้ว
}
function closeStoryModal(){
  document.getElementById('storyModal').classList.remove('open');
  document.body.style.overflow='';
}
function buildSlideHTML(i){
  const s=STORY_MODAL.story;const art=i+1;
  return `
    <div class="slide-art">
      <span class="slide-art-emoji">${s.scene}</span>
      <img src="${storyImgPath(STORY_MODAL.cat,STORY_MODAL.id,art)}" alt="" decoding="async" onerror="this.style.display='none'">
    </div>
    <div class="slide-body">
      <p class="slide-text">${s.body[i]}</p>
      ${i===STORY_MODAL.total-1?`<div class="lesson"><div class="lt">💡 บทเรียนสำหรับหนู</div><p>${s.lesson}</p></div>`:''}
    </div>`;
}
function renderStorySlide(){
  const i=STORY_MODAL.slide;
  document.getElementById('storyPageBase').innerHTML=buildSlideHTML(i);
  document.getElementById('storyPrevBtn').style.visibility=i===0?'hidden':'visible';
  document.getElementById('storyNextBtn').innerHTML=i===STORY_MODAL.total-1?'<svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>':'<svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>';
  const dots=document.getElementById('storyModalDots');dots.innerHTML='';
  for(let d=0;d<STORY_MODAL.total;d++){
    const dot=document.createElement('span');dot.className='dot'+(d===i?' on':d<i?' done':'');
    dots.appendChild(dot);
  }
}
function flipStory(newIndex,dir){
  if(STORY_MODAL.flipping)return;
  STORY_MODAL.flipping=true;
  const stage=document.getElementById('storyStage');
  const base=document.getElementById('storyPageBase');
  stage.style.height=base.offsetHeight+'px';
  const overlay=document.createElement('div');
  overlay.className='story-page flip-page '+(dir==='next'?'flip-next':'flip-prev');
  overlay.innerHTML=base.innerHTML;
  stage.appendChild(overlay);
  STORY_MODAL.slide=newIndex;
  renderStorySlide();
  overlay.getBoundingClientRect();
  requestAnimationFrame(()=>{overlay.classList.add('turning');});
  setTimeout(()=>{
    overlay.remove();
    stage.style.height='';
    STORY_MODAL.flipping=false;
  },520);
}
function storyNext(){
  if(STORY_MODAL.slide>=STORY_MODAL.total-1){closeStoryModal();return;}
  flipStory(STORY_MODAL.slide+1,'next');
}
function storyPrev(){
  if(STORY_MODAL.slide<=0)return;
  flipStory(STORY_MODAL.slide-1,'prev');
}
(function(){
  const card=document.getElementById('storyModalCard');
  let sx=0,sy=0,tracking=false;
  card.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY;tracking=true;});
  card.addEventListener('pointerup',e=>{
    if(!tracking)return;tracking=false;
    const dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy)*1.2){dx<0?storyNext():storyPrev();}
  });
})();

/* ============ HOME RAILS (คอราเซลลอยเลื่อน) ============ */
function railChip(art,label,onclick,cls){
  return `<button class="rail-chip${cls?' '+cls:''}" onclick="${onclick}">
    <span class="rc-art">${art}</span><span class="rc-label">${label}</span></button>`;
}
function openPicFromHome(cat,key){
  go('colorhub');
  openCategory(cat);
  curPic=key;
  loadPic();
  showEditorStage();
}
function buildRails(){
  const gamesHtml=iqGames.map(g=>
    railChip(`<span class="rc-game">${gameArt[g.k]||''}</span>`,g.n,`startGame('${g.k}')`)).join('');

  const allStories=[...stories.map(s=>({cat:'prophets',s})),...goodKidStories.map(s=>({cat:'goodkid',s}))];
  const storiesHtml=allStories.map(o=>
    railChip(storyCover(o.cat,o.s),o.s.title,`openStory('${o.cat}','${o.s.id}')`,'rc-photo')).join('');

  const picks=[];
  colorCategories.forEach(c=>{
    shuffle(Object.keys(picLib[c.key])).slice(0,4).forEach(k=>picks.push({cat:c.key,k,pic:picLib[c.key][k]}));
  });
  const colorHtml=shuffle(picks).map(p=>
    railChip(`<img src="${p.pic.src}" loading="lazy" alt="">`,p.pic.name,`openPicFromHome('${p.cat}','${p.k}')`,'rc-white')).join('');

  document.getElementById('railGames').innerHTML=gamesHtml;
  document.getElementById('railStories').innerHTML=storiesHtml;
  document.getElementById('railColor').innerHTML=colorHtml;
}

/* ============ Hook up hub inits ============ */
const _go=go;
go=function(id){
  _go(id);
  if(id==='colorhub')initColorHub();
  if(id==='storyhub')initStoryHub();
};

/* init */
initStoryHub();
renderIqHub();
buildRails();
setupPaintCanvas();
setupFillCanvas();
setupZoom();
</script>
